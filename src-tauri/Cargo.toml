[package]
name = "beatify"
version = "0.1.4"
description = "An Apple Music-like player built with Tauri + Rust + React"
authors = ["beatify"]
edition = "2021"

[lib]
name = "beatify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.22"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["stream", "blocking", "rustls-tls"], default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }
notify = "6"
parking_lot = "0.12"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.36"
percent-encoding = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
